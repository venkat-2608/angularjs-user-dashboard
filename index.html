<!DOCTYPE html>
<html ng-app="registerApp">

<head>
    <title>AngularJS User Dashboard</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body ng-controller="registerController">

<div class="container">

    <h2>User Dashboard</h2>

    <form name="regForm" ng-submit="submitForm()" novalidate>

        <label>Name</label>
        <input type="text" ng-model="user.name" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" ng-model="user.email" placeholder="Enter your email" required>

        <button type="submit">Submit</button>

    </form>

    <!-- Live Preview -->
    <div ng-if="user.name || user.email">
        <h3>Live Preview</h3>
        <p><b>Name:</b> {{user.name}}</p>
        <p><b>Email:</b> {{user.email}}</p>
    </div>

    <!-- Message -->
    <p class="success" ng-if="message">{{message}}</p>

</div>

<script src="app.js"></script>

</body>
</html>
