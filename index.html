<!DOCTYPE html>
<html ng-app="registerApp">

<head>
    <title>AngularJS User Dashboard</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body ng-controller="registerController">

    <div class="container">

        <h2>User Dashboard</h2>

        <p style="text-align:center; font-size:14px; color:#555;">
            Enter your details to preview and submit user information
        </p>

        <form name="regForm" ng-submit="submitForm(regForm)" novalidate>

            <label>Name</label>
            <input type="text"
                   name="name"
                   ng-model="user.name"
                   placeholder="Enter your name"
                   required>

            <span style="color:red"
                  ng-show="regForm.name.$touched && regForm.name.$invalid">
                Name is required
            </span>

            <label>Email</label>
            <input type="email"
                   name="email"
                   ng-model="user.email"
                   placeholder="Enter your email"
                   required>

            <span style="color:red"
                  ng-show="regForm.email.$touched && regForm.email.$invalid">
                Valid email is required
            </span>

            <button type="submit" ng-disabled="regForm.$invalid">
                Submit
            </button>

            <button type="button" ng-click="resetForm(regForm)">
                Reset
            </button>

        </form>

        <!-- Updated Title -->
        <div class="preview" ng-if="user.name || user.email">
            <h3>User Input Preview</h3>
            <p><b>Name:</b> {{user.name}}</p>
            <p><b>Email:</b> {{user.email}}</p>
        </div>

        <user-card ng-if="submittedUser" user="submittedUser"></user-card>

        <p class="success" ng-if="message">{{message}}</p>

    </div>

    <script src="app.js"></script>

</body>
</html>
